name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      # The race detector needs CGO; the application itself does not.
      - run: go test -race ./...
      - run: go build ./cmd/codememory
        env:
          CGO_ENABLED: '0'
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Retries only absorb vulnerability-database download failures; a real
      # finding fails every attempt.
      - run: |
          for attempt in 1 2 3; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... && exit 0
            echo "govulncheck attempt $attempt failed"; sleep 20
          done
          exit 1
        shell: bash
