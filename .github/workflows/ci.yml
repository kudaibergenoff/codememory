name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      # The race detector needs CGO; the application itself does not.
      - run: go test -race ./...
      - run: go build ./cmd/codememory
        env:
          CGO_ENABLED: '0'
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # v1.1.4 panicked on Go 1.27 standard-library code for linux
      # ("unexpected expr: *ast.KeyValueExpr"); keep govulncheck current.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
