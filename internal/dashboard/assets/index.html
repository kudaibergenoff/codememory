<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeMemory dashboard</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>CodeMemory <span id="project"></span></h1>
  <p class="note" id="note">Loading local measurements…</p>
</header>
<main>
  <section aria-labelledby="h-usage">
    <h2 id="h-usage">Last 30 days <span class="tag measured">measured</span></h2>
    <div class="tiles" id="tiles"></div>
  </section>
  <section aria-labelledby="h-daily">
    <h2 id="h-daily">Daily activity <span class="tag measured">measured</span></h2>
    <div class="scroll"><table id="daily"></table></div>
  </section>
  <section aria-labelledby="h-bench">
    <h2 id="h-bench">Latest benchmark <span class="tag estimated">estimated</span></h2>
    <p class="note" id="bench-note"></p>
    <div class="scroll"><table id="bench"></table></div>
  </section>
  <section aria-labelledby="h-state">
    <h2 id="h-state">Local state <span class="tag measured">measured</span></h2>
    <div class="tiles" id="state"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
